<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paper Retrieval</title>
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      line-height: 1.5;
      color: #1a1a1a;
      background: #f5f5f5;
      margin: 0;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin: 0 0 0.25rem;
    }

    .subtitle {
      color: #555;
      margin: 0 0 1.25rem;
      font-size: 0.95rem;
    }

    .tabs {
      display: flex;
      gap: 0.25rem;
      margin-bottom: 1.25rem;
      border-bottom: 1px solid #ddd;
    }

    .tab {
      padding: 0.5rem 1rem;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      color: #555;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
    }

    .tab:hover {
      color: #1a1a1a;
    }

    .tab.active {
      color: #1a1a1a;
      border-bottom-color: #1a1a1a;
    }

    .panel {
      display: none;
    }

    .panel.active {
      display: block;
    }

    form {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    input[type="text"] {
      flex: 1;
      padding: 0.6rem 0.75rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
    }

    button[type="submit"],
    .btn-primary {
      padding: 0.6rem 1.25rem;
      background: #1a1a1a;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
    }

    button[type="submit"]:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status {
      min-height: 1.25rem;
      color: #555;
      font-size: 0.9rem;
      margin-bottom: 1rem;
    }

    .status.error { color: #b00020; }

    .error-box {
      display: none;
      background: #fdecea;
      border: 1px solid #f5c6c6;
      border-radius: 8px;
      padding: 0.75rem 1rem;
      margin-bottom: 1rem;
      color: #8a1f1f;
      font-size: 0.9rem;
    }

    .error-box.visible { display: block; }

    .error-box strong {
      display: block;
      margin-bottom: 0.25rem;
    }

    .results {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .card {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 1rem 1.25rem;
    }

    .card h2 {
      font-size: 1.05rem;
      font-weight: 600;
      margin: 0 0 0.5rem;
    }

    .meta {
      font-size: 0.9rem;
      color: #444;
      margin-bottom: 0.5rem;
    }

    .meta span + span::before {
      content: " · ";
    }

    .score {
      display: inline-block;
      background: #eef2ff;
      color: #3730a3;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
    }

    details {
      margin-top: 0.5rem;
      font-size: 0.9rem;
    }

    summary {
      cursor: pointer;
      color: #555;
      user-select: none;
    }

    .abstract {
      margin-top: 0.5rem;
      color: #333;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .history-item {
      width: 100%;
      text-align: left;
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 0.85rem 1rem;
      cursor: pointer;
      font: inherit;
      color: inherit;
    }

    .history-item:hover {
      border-color: #bbb;
      background: #fafafa;
    }

    .history-query {
      font-weight: 600;
      margin-bottom: 0.25rem;
      word-break: break-word;
    }

    .history-meta {
      font-size: 0.85rem;
      color: #666;
    }

    .history-meta span + span::before {
      content: " · ";
    }

    .history-empty {
      color: #666;
      font-size: 0.95rem;
      padding: 1rem 0;
    }

    .filters {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 0.75rem;
      margin-bottom: 1rem;
      padding: 1rem;
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
    }

    .filters label {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      font-size: 0.8rem;
      color: #444;
    }

    .filters select,
    .filters input[type="number"] {
      padding: 0.4rem 0.5rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.9rem;
    }

    .filters-row {
      grid-column: 1 / -1;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
      font-size: 0.85rem;
    }

    .corpus-note {
      font-size: 0.85rem;
      color: #555;
      margin-bottom: 0.75rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Paper Retrieval</h1>
    <p class="subtitle">1st baseline — scripted SS + arXiv retrieval with configurable filters.</p>

    <div class="tabs" role="tablist">
      <button type="button" class="tab active" id="tab-search" role="tab" aria-selected="true">
        Search
      </button>
      <button type="button" class="tab" id="tab-history" role="tab" aria-selected="false">
        History
      </button>
    </div>

    <div class="panel active" id="panel-search" role="tabpanel">
      <form id="search-form">
        <input
          type="text"
          id="query"
          name="query"
          placeholder="e.g. retrieval augmented generation"
          required
        >
        <button type="submit" id="submit-btn">Search</button>
      </form>

      <div class="filters" id="filters">
        <label>Rank method
          <select id="filter-rank"><option value="sbert">sbert</option></select>
        </label>
        <label>Field (SS)
          <select id="filter-field"><option value="">All fields</option></select>
        </label>
        <label>From year
          <input type="number" id="filter-from-year" min="1900" max="2100">
        </label>
        <label>To year
          <input type="number" id="filter-to-year" min="1900" max="2100">
        </label>
        <label>Min score
          <input type="number" id="filter-min-score" min="0" max="1" step="0.05">
        </label>
        <label>Preview count
          <input type="number" id="filter-display-limit" min="1" max="50">
        </label>
        <div class="filters-row">
          <label><input type="checkbox" id="filter-year-chunk" checked> Year-chunk fetch</label>
          <label><input type="checkbox" id="filter-strict-timeline"> Strict timeline filter</label>
          <label><input type="checkbox" id="filter-ss" checked> Semantic Scholar</label>
          <label><input type="checkbox" id="filter-arxiv" checked> arXiv</label>
        </div>
      </div>

      <p class="status" id="status"></p>
      <div class="error-box" id="error-box" role="alert"></div>
      <p class="corpus-note" id="corpus-note" hidden></p>
      <div class="results" id="results"></div>
    </div>

    <div class="panel" id="panel-history" role="tabpanel">
      <p class="status" id="history-status"></p>
      <div class="history-list" id="history-list"></div>
    </div>
  </div>

  <script>
    const form = document.getElementById("search-form");
    const queryInput = document.getElementById("query");
    const submitBtn = document.getElementById("submit-btn");
    const statusEl = document.getElementById("status");
    const errorBoxEl = document.getElementById("error-box");
    const corpusNoteEl = document.getElementById("corpus-note");
    const resultsEl = document.getElementById("results");
    const tabSearch = document.getElementById("tab-search");
    const tabHistory = document.getElementById("tab-history");
    const panelSearch = document.getElementById("panel-search");
    const panelHistory = document.getElementById("panel-history");
    const historyStatusEl = document.getElementById("history-status");
    const historyListEl = document.getElementById("history-list");

    function setStatus(message, isError = false) {
      statusEl.textContent = message;
      statusEl.className = isError ? "status error" : "status";
    }

    function showError(message) {
      errorBoxEl.innerHTML = `
        <strong>Search failed</strong>
        <span>${escapeHtml(message)}</span>
      `;
      errorBoxEl.classList.add("visible");
      setStatus("", false);
    }

    function clearError() {
      errorBoxEl.classList.remove("visible");
      errorBoxEl.innerHTML = "";
    }

    function buildConfigPayload() {
      const sources = [];
      if (document.getElementById("filter-ss").checked) sources.push("semantic_scholar");
      if (document.getElementById("filter-arxiv").checked) sources.push("arxiv");
      const field = document.getElementById("filter-field").value;
      return {
        rank_method: document.getElementById("filter-rank").value,
        fields_of_study: field ? [field] : [],
        timeline_from_year: Number(document.getElementById("filter-from-year").value),
        timeline_to_year: Number(document.getElementById("filter-to-year").value),
        min_relevance_score: Number(document.getElementById("filter-min-score").value),
        display_limit: Number(document.getElementById("filter-display-limit").value),
        year_chunk_fetch: document.getElementById("filter-year-chunk").checked,
        strict_timeline_filter: document.getElementById("filter-strict-timeline").checked,
        sources,
      };
    }

    async function loadDefaultConfig() {
      try {
        const response = await fetch("/config");
        const cfg = await response.json();
        const rankSel = document.getElementById("filter-rank");
        rankSel.innerHTML = (cfg.options?.rank_method || ["sbert", "tfidf", "recency"])
          .map((m) => `<option value="${m}">${m}</option>`).join("");
        rankSel.value = cfg.rank_method || "sbert";

        const fieldSel = document.getElementById("filter-field");
        const fields = cfg.options?.fields_of_study || ["", "Computer Science"];
        fieldSel.innerHTML = fields.map((f) =>
          `<option value="${escapeHtml(f)}">${f || "All fields"}</option>`
        ).join("");
        fieldSel.value = (cfg.fields_of_study && cfg.fields_of_study[0]) || "";

        document.getElementById("filter-from-year").value = cfg.timeline_from_year;
        document.getElementById("filter-to-year").value = cfg.timeline_to_year;
        document.getElementById("filter-min-score").value = cfg.min_relevance_score;
        document.getElementById("filter-display-limit").value = cfg.display_limit;
        document.getElementById("filter-year-chunk").checked = cfg.year_chunk_fetch !== false;
        document.getElementById("filter-strict-timeline").checked = !!cfg.strict_timeline_filter;
        document.getElementById("filter-ss").checked = (cfg.sources || []).includes("semantic_scholar");
        document.getElementById("filter-arxiv").checked = (cfg.sources || []).includes("arxiv");
      } catch {
        /* defaults stay in HTML */
      }
    }

    loadDefaultConfig();

    function formatAuthors(authors) {
      if (!authors || authors.length === 0) return "Unknown";
      return authors.join(", ");
    }

    function renderPaper(paper, index) {
      const card = document.createElement("article");
      card.className = "card";

      const title = paper.title || "Untitled";
      const year = paper.year ?? "n/a";
      const score = (paper.relevance_score ?? 0).toFixed(4);
      const abstract = paper.abstract || "No abstract available.";

      card.innerHTML = `
        <h2>${index}. ${escapeHtml(title)}</h2>
        <div class="meta">
          <span>${escapeHtml(formatAuthors(paper.authors))}</span>
          <span>${escapeHtml(String(year))}</span>
          <span class="score">${score}</span>
        </div>
        <details>
          <summary>Abstract</summary>
          <p class="abstract">${escapeHtml(abstract)}</p>
        </details>
      `;

      return card;
    }

    function renderResults(data, options = {}) {
      const papers = data.papers_display || data.papers || [];
      const corpusSize = (data.papers || []).length;
      resultsEl.innerHTML = "";
      corpusNoteEl.hidden = true;

      if (papers.length === 0) {
        setStatus("No papers found.");
        return;
      }

      let status = options.fromHistory
        ? `Past search: showing ${papers.length} of ${corpusSize} accepted.`
        : `Showing ${papers.length} of ${corpusSize} accepted papers (preview).`;

      if (data.metrics?.papers_rejected) {
        status += ` ${data.metrics.papers_rejected} rejected by screening.`;
      }
      if (options.fromHistory && data.created_at) {
        status += ` · ${formatDate(data.created_at)}`;
      }
      setStatus(status);

      if (corpusSize > papers.length) {
        corpusNoteEl.textContent =
          `Full RAG corpus: ${corpusSize} papers in API field "papers". Preview shows top ${papers.length} by score.`;
        corpusNoteEl.hidden = false;
      }

      papers.forEach((paper, index) => {
        resultsEl.appendChild(renderPaper(paper, index + 1));
      });
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    function formatDate(iso) {
      const date = new Date(iso);
      if (Number.isNaN(date.getTime())) return iso;
      return date.toLocaleString(undefined, {
        dateStyle: "medium",
        timeStyle: "short",
      });
    }

    function switchTab(name) {
      const isSearch = name === "search";
      tabSearch.classList.toggle("active", isSearch);
      tabHistory.classList.toggle("active", !isSearch);
      tabSearch.setAttribute("aria-selected", String(isSearch));
      tabHistory.setAttribute("aria-selected", String(!isSearch));
      panelSearch.classList.toggle("active", isSearch);
      panelHistory.classList.toggle("active", !isSearch);

      if (!isSearch) {
        loadHistoryList();
      }
    }

    tabSearch.addEventListener("click", () => switchTab("search"));
    tabHistory.addEventListener("click", () => switchTab("history"));

    async function loadHistoryList() {
      historyStatusEl.textContent = "Loading history…";
      historyListEl.innerHTML = "";

      try {
        const response = await fetch("/history");
        const data = await response.json();
        const items = data.items || [];

        if (items.length === 0) {
          historyStatusEl.textContent = "";
          historyListEl.innerHTML = '<p class="history-empty">No past searches yet. Run a live search to see history here.</p>';
          return;
        }

        historyStatusEl.textContent = `${items.length} past search${items.length === 1 ? "" : "es"}`;
        historyListEl.innerHTML = "";

        items.forEach((item) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "history-item";
          button.innerHTML = `
            <div class="history-query">${escapeHtml(item.query)}</div>
            <div class="history-meta">
              <span>${escapeHtml(formatDate(item.created_at))}</span>
              <span>${escapeHtml(item.status)}</span>
              <span>${item.paper_count} shown</span>
            </div>
          `;
          button.addEventListener("click", () => openHistoryItem(item.id));
          historyListEl.appendChild(button);
        });
      } catch (error) {
        historyStatusEl.textContent = "";
        historyListEl.innerHTML = `<p class="history-empty">${escapeHtml(error.message || "Could not load history.")}</p>`;
      }
    }

    async function openHistoryItem(id) {
      switchTab("search");
      resultsEl.innerHTML = "";
      clearError();
      setStatus("Loading past search…");

      try {
        const response = await fetch(`/history/${id}`);
        let data = {};
        try {
          data = await response.json();
        } catch {
          throw new Error("Server returned an invalid response.");
        }

        if (!response.ok) {
          showError(data.error || "Could not load that search.");
          return;
        }

        if (data.query) {
          queryInput.value = data.query;
        }
        renderResults(data, { fromHistory: true });
      } catch (error) {
        showError(error.message || "Network error. Is the server running?");
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const query = queryInput.value.trim();
      if (!query) return;

      submitBtn.disabled = true;
      resultsEl.innerHTML = "";
      clearError();
      setStatus("Searching and ranking papers…");

      try {
        const response = await fetch("/search", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query, config: buildConfigPayload() }),
        });

        let data = {};
        try {
          data = await response.json();
        } catch {
          throw new Error("Server returned an invalid response.");
        }

        if (!response.ok) {
          showError(data.error || "Search failed. Please try again later.");
          return;
        }

        renderResults(data);
      } catch (error) {
        showError(error.message || "Network error. Is the server running?");
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
